---
- name: Install Python packages
  dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Create database application user
  user:
    name: notesdb
    system: true
    create_home: true
    shell: /sbin/nologin

- name: Create database application directory
  file:
    path: /opt/notesdb
    state: directory
    owner: notesdb
    group: notesdb
    mode: '0755'

- name: Copy database API
  copy:
    src: db_api.py
    dest: /opt/notesdb/db_api.py
    owner: notesdb
    group: notesdb
    mode: '0644'

- name: Copy database requirements
  copy:
    src: requirements.txt
    dest: /opt/notesdb/requirements.txt
    owner: notesdb
    group: notesdb
    mode: '0644'

- name: Create Python virtual environment
  command:
    cmd: python3 -m venv /opt/notesdb/venv
    creates: /opt/notesdb/venv/bin/python

- name: Install database Python dependencies
  pip:
    requirements: /opt/notesdb/requirements.txt
    virtualenv: /opt/notesdb/venv

- name: Set ownership of database application directory
  file:
    path: /opt/notesdb
    state: directory
    recurse: true
    owner: notesdb
    group: notesdb

- name: Install database systemd service
  template:
    src: notesdb.service.j2
    dest: /etc/systemd/system/notesdb.service
    mode: '0644'

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Enable and start database API
  systemd:
    name: notesdb
    enabled: true
    state: started