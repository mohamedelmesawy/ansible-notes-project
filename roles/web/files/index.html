<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ansible Notes App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .time {
            margin-bottom: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .content {
            font-size: 17px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .empty {
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📝 Ansible Notes App</h1>
        <p>Web deployed with Ansible • SQLite Database API</p>
    </div>

    <div class="card">
        <form method="POST" action="/add">

            <textarea
                name="content"
                placeholder="Write your note here..."
                required
            ></textarea>

            <button type="submit">
                Save Note
            </button>

        </form>
    </div>


    {% for note in notes %}

        <div class="card">

            <div class="time">
                🕒 {{ note.created_at }}
            </div>

            <div class="content">
                📌 {{ note.content }}
            </div>

        </div>

    {% else %}

        <div class="card empty">
            No notes yet.
        </div>

    {% endfor %}

</div>

</body>
</html>
