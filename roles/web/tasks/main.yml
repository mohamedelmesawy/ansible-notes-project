---
- name: Install web packages
  dnf:
    name:
      - python3
      - python3-pip
      - nginx
      - nginx-core
      - nginx-mimetypes
    state: present

- name: Check nginx main configuration
  stat:
    path: /etc/nginx/nginx.conf
  register: nginx_conf

- name: Reinstall nginx-core if nginx.conf is missing
  command: dnf reinstall -y nginx-core
  when: not nginx_conf.stat.exists

- name: Check nginx mime types
  stat:
    path: /etc/nginx/mime.types
  register: nginx_mime_types

- name: Reinstall nginx-mimetypes if mime.types is missing
  command: dnf reinstall -y nginx-mimetypes
  when: not nginx_mime_types.stat.exists

- name: Create web application user
  user:
    name: notesapp
    system: true
    create_home: true
    shell: /sbin/nologin

- name: Create web application directory
  file:
    path: /opt/notesapp
    state: directory
    owner: notesapp
    group: notesapp
    mode: '0755'

- name: Test nginx configuration
  command: nginx -t
  changed_when: false

- name: Enable and start nginx
  systemd:
    name: nginx
    enabled: true
    state: started

- name: Stop and disable Apache if installed
  systemd:
    name: httpd
    state: stopped
    enabled: false
  failed_when: false


- name: Copy web application
  copy:
    src: app.py
    dest: /opt/notesapp/app.py
    owner: notesapp
    group: notesapp
    mode: '0644'

- name: Copy web requirements
  copy:
    src: requirements.txt
    dest: /opt/notesapp/requirements.txt
    owner: notesapp
    group: notesapp
    mode: '0644'

- name: Create templates directory
  file:
    path: /opt/notesapp/templates
    state: directory
    owner: notesapp
    group: notesapp
    mode: '0755'

- name: Deploy HTML template
  copy:
    src: index.html
    dest: /opt/notesapp/templates/index.html
    owner: notesapp
    group: notesapp
    mode: '0644'

- name: Create Python virtual environment
  command:
    cmd: python3 -m venv /opt/notesapp/venv
    creates: /opt/notesapp/venv/bin/python

- name: Install web Python dependencies
  pip:
    requirements: /opt/notesapp/requirements.txt
    virtualenv: /opt/notesapp/venv

- name: Set application directory ownership
  file:
    path: /opt/notesapp
    state: directory
    recurse: true
    owner: notesapp
    group: notesapp


- name: Deploy web environment file
  template:
    src: app.env.j2
    dest: /opt/notesapp/.env
    owner: notesapp
    group: notesapp
    mode: '0600'

- name: Install web systemd service
  template:
    src: notesapp.service.j2
    dest: /etc/systemd/system/notesapp.service
    mode: '0644'

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Enable and start web application
  systemd:
    name: notesapp
    enabled: true
    state: started

- name: Create nginx conf.d directory
  file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable default nginx server block
  replace:
    path: /etc/nginx/nginx.conf
    regexp: 'listen\s+80\s+default_server;'
    replace: 'listen 80;'
    
- name: Deploy nginx configuration
  copy:
    src: notesapp-nginx.conf
    dest: /etc/nginx/conf.d/notesapp.conf
    owner: root
    group: root
    mode: '0644'
